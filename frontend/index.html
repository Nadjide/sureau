<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#111720" />
    <link rel="icon" type="image/svg+xml" href="/sentinel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sentinel — gestion de matériel et exploration spatiale du parc informatique." />
    <title>Sentinel — Atelier spatial</title>
    <script>
      try {
        const theme = localStorage.getItem('sentinel-theme');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch { /* Keep the default theme when browser storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
