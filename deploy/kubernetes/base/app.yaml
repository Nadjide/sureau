apiVersion: v1
kind: Service
metadata:
  name: sureau
  labels:
    app.kubernetes.io/name: sureau
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: sureau
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sureau
  labels:
    app.kubernetes.io/name: sureau
    app.kubernetes.io/component: app
spec:
  replicas: 1
  # Une seule version de l'application à la fois : les migrations de la base
  # ne tournent jamais en parallèle d'une version plus ancienne.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sureau
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sureau
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          command:
            - sh
            - -c
            - until pg_isready --host=postgres --username=sureau --dbname=sureau; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: sureau
          image: sureau
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/sureau
            - name: DB_USERNAME
              value: sureau
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sureau-secrets
                  key: db-password
            - name: SUREAU_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sureau-secrets
                  key: setup-token
            - name: SUREAU_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: sureau-config
                  key: SUREAU_COOKIE_SECURE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Le démarrage de la JVM et des migrations peut prendre une minute.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          # La disponibilité dépend de la base ; la vie de l'application, non :
          # une panne de PostgreSQL ne redémarre donc pas l'application.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
