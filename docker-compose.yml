name: sureau

services:
  postgres:
    image: postgres:17-alpine
    container_name: sureau-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-sureau}
      POSTGRES_USER: ${DB_USERNAME:-sureau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sureau_dev}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: ${SUREAU_POSTGRES_VOLUME:-sureau_postgres_data}
