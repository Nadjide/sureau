name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Pour une faille de sécurité, n’utilisez pas ce formulaire : suivez la [politique de sécurité](https://github.com/Nadjide/sureau/security/policy).
        Ne collez ni mot de passe, ni clé d’installation, ni contenu d’un fichier d’environnement.
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Le comportement observé, avec le message d’erreur affiché s’il y en a un.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui était attendu
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: main, a26e358…
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Script deploy/sureau.sh ou sureau.ps1 (Docker Compose)
        - Docker Compose configuré à la main
        - Kubernetes
        - Environnement de développement
    validations:
      required: true
  - type: input
    id: navigateur
    attributes:
      label: Navigateur et système
      placeholder: Chrome 150 sous Windows 11
  - type: textarea
    id: journaux
    attributes:
      label: Journaux utiles
      description: Par exemple la sortie de `deploy/sureau.sh logs` autour du problème, sans secret.
      render: shell
