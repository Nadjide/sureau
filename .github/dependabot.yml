# Mises à jour automatiques des dépendances, proposées en pull requests que la
# CI vérifie avant toute fusion. Chaque semaine, les versions mineures et
# correctives d'un écosystème arrivent groupées ; une version majeure arrive
# seule, pour être relue. Une nouvelle version n'est proposée qu'après 14 jours
# de recul. Les alertes de sécurité ne sont pas concernées par ce délai.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      javascript:
        update-types: [minor, patch]
    # Les types de Node suivent la version de Node qui construit et exécute le
    # projet (22), pas la dernière publiée : sinon des API absentes passeraient
    # la vérification des types.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      java:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Images de base du Dockerfile et des manifestes Kubernetes. pnpm reste mis à
  # jour à la main, en même temps que packageManager et la CI. L'image de
  # l'application (sureau) est construite par le dépôt lui-même. Les versions
  # majeures restent un choix : Node et Java suivent leurs versions LTS (22 et
  # 21), et PostgreSQL ne change de version majeure qu'avec une migration de ses
  # données.
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/kubernetes/base
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: pnpm/pnpm
      - dependency-name: ghcr.io/pnpm/pnpm
      - dependency-name: sureau
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: sureau
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
