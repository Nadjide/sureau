name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Appelé par le workflow de publication, qui exige les mêmes validations.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Base de test dédiée : le profil de test vise 127.0.0.1:15432/sureau_test.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sureau_test
          POSTGRES_USER: sureau_test
          POSTGRES_PASSWORD: sureau_test_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U sureau_test -d sureau_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sh ./mvnw --batch-mode --no-transfer-progress test
        working-directory: backend

  delivery:
    name: Installation files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts parse
        run: |
          sh -n deploy/sureau.sh
          sh -n e2e/run.sh
      - name: Shell scripts pass ShellCheck
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
      - name: Compose files are valid
        env:
          SUREAU_DB_PASSWORD: ci-validation-only
          SUREAU_SETUP_TOKEN: ci-validation-only
        run: |
          docker compose -f docker-compose.install.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: Compose refuses to start without secrets
        run: |
          if docker compose -f docker-compose.install.yml config --quiet 2> /dev/null; then
            echo "docker-compose.install.yml must require SUREAU_DB_PASSWORD and SUREAU_SETUP_TOKEN" >&2
            exit 1
          fi
      - name: Kubernetes manifests render without any secret
        run: |
          kubectl kustomize deploy/kubernetes/base > rendered.yaml
          if grep -q '^kind: Secret' rendered.yaml; then
            echo "secrets must be created outside the repository" >&2
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          cache: true
          cache_dependency_path: e2e/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install test dependencies and browser
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Install, restart, back up and restore a real instance
        run: sh e2e/run.sh
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
