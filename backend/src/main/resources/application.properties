spring.application.name=sureau-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sureau}
spring.datasource.username=${DB_USERNAME:sureau}
spring.datasource.password=${DB_PASSWORD:sureau_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
# Behind a reverse proxy on a private address, X-Forwarded-Proto and X-Forwarded-For give the
# real scheme (HTTPS, hence HSTS) and client address. Headers sent from public addresses are ignored.
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

sureau.setup-token=${SUREAU_SETUP_TOKEN:}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SUREAU_COOKIE_SECURE:false}
# Instances sharing a host name need distinct names: browsers ignore the port for cookies.
sureau.session.cookie-name=${SUREAU_COOKIE_NAME:SESSION}

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never

# Compress the compiled interface (about 1.6 MB of scripts and styles). API JSON responses stay
# uncompressed: they are small, and this rules out compression attacks on their content.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=1KB
