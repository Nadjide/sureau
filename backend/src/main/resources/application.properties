spring.application.name=sureau-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sureau}
spring.datasource.username=${DB_USERNAME:sureau}
spring.datasource.password=${DB_PASSWORD:sureau_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

sureau.setup-token=${SUREAU_SETUP_TOKEN:}
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SUREAU_COOKIE_SECURE:false}

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=always
